<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Origami</title>
    <link rel="stylesheet" href="/Home.css" />
    <link rel="stylesheet" href="/admin/css/admin.css" />
    <link rel="icon" href="../../img/LOGO+CIRCULO.webp" type="image/webp" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      .back-link {
        position: absolute;
        top: 2rem;
        left: 2rem;
        color: rgba(255, 255, 255, 0.75);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.9rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.07);
        font-size: 0.85rem;
        font-weight: 500;
        backdrop-filter: blur(10px);
        transition: all 0.2s ease;
      }

      .back-link:hover {
        background: rgba(0, 212, 255, 0.1);
        border-color: rgba(0, 212, 255, 0.3);
        color: #00d4ff;
      }
      .toggle-password {
        position: absolute;
        right: 2.5rem;
        top: 40%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        color: var(--text-muted-color);
        cursor: pointer;
        padding: 0.5rem;
        font-size: 1rem;
        transition: color 0.3s ease;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="bg-bubbles" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <a href="/Home.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i>
      Volver a la tienda
    </a>

    <div class="login-container">
      <div class="login-card glass-effect">
        <div class="login-header">
          <div class="logo">
            <img
              src="/img/LOGO+CIRCULO.webp"
              alt="Origami"
              class="logo-img logo-circular"
              height="auto"
            />
            <img
              src="/img/ORIGWHITE.webp"
              alt="Origami"
              class="logo-img logo-text"
              height="300px"
            />
          </div>
          <p style="margin:0.75rem 0 0;font-size:0.8rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(0,212,255,0.8);">Panel de Administración</p>
        </div>

        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-group">
              <i class="fa-solid fa-envelope"></i>
              <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="tu@email.com"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-group">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="••••••••"
              />
              <button
                type="button"
                class="toggle-password"
                onclick="togglePassword()"
              >
                <i class="fa-solid fa-eye" id="toggleIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="login-btn" style="margin-top:0.4rem;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            Iniciar Sesión
          </button>
        </form>

        <div id="errorMessage" class="error-message" style="display:none;"></div>

        <p style="margin:1.5rem 0 0;padding-top:1.25rem;border-top:1px solid rgba(255,255,255,0.08);font-size:0.78rem;color:rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;gap:0.4rem;">
          <i class="fa-solid fa-shield-halved"></i>
          Acceso restringido · Solo personal autorizado
        </p>
      </div>
    </div>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- API Configuration & Service -->
    <script
      src="/admin/js/config.js"
      onerror="console.error('Error cargando config.js')"
    ></script>
    <script
      src="/admin/js/api-service.js"
      onerror="console.error('Error cargando api-service.js')"
    ></script>
    <script
      src="/admin/js/auth.js"
      onerror="console.error('Error cargando auth.js')"
    ></script>
    <script src="/admin/js/login-ui.js"></script>
    <script>
      // Background rotation
      const backgroundImages = ["../../img/PLANTILLA 1.webp"];

      let currentImageIndex = 0;
      const body = document.body;

      function changeBackground() {
        body.style.backgroundImage = `url('${backgroundImages[currentImageIndex]}')`;
        body.style.backgroundSize = 'cover';
        body.style.backgroundPosition = 'center';
        body.style.backgroundAttachment = 'fixed';
      }

      changeBackground();
    </script>
  </body>
</html>
